baseURL = "https://sirijiji.github.io/classiques-martiaux-chinois/"
locale = "fr-FR"
title = "Classiques des arts martiaux chinois"
theme = "PaperMod"
defaultContentLanguage = "fr"

enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

[menu]
  [[menu.main]]
    identifier = "accueil"
    name = "Accueil"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    identifier = "apropos"
    name = "À propos"
    url = "/apropos/"
    weight = 3

[params]
  env = "production"
  description = "Traductions en français de classiques chinois des arts martiaux : taiji quan, xingyi, bagua, bâton, sabre, épée et plus."
  keywords = ["arts martiaux", "chinois", "taiji", "taïchi", "xingyi", "bagua", "traductions", "classiques"]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = false

  [params.homeInfoParams]
    Title = "Classiques des arts martiaux chinois"
    Content = """
Traductions en français de manuels classiques chinois des arts martiaux
(taiji quan, xingyi, bagua, armes traditionnelles), réalisées à partir des
textes originaux chinois, aujourd'hui dans le domaine public.
"""
    Image = "images/guan-yu-shangxi-ming.jpg"
    ImageAlt = "Guan Yu (Guan Gong), saint des arts martiaux — détail d'un tableau de la dynastie Ming"
    ImageCaption = "Guan Yu (关羽), saint des arts martiaux — détail du tableau de Shang Xi (商喜), dynastie Ming, XVe siècle — domaine public"

  [params.assets]
    disableHLJS = true
    favicon = "images/taijitu-red.svg"
    favicon16x16 = "images/taijitu-red.svg"
    favicon32x32 = "images/taijitu-red.svg"

  [params.label]
    text = "Classiques des arts martiaux chinois"
    icon = "images/taijitu-red.svg"
    iconHeight = 32

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 2

  [params.support]
    # À REMPLACER par votre lien PayPal (ex. https://www.paypal.com/paypalme/votre-pseudo)
    paypalUrl = "https://www.paypal.com/paypalme/username"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
